<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ARTVOT | Admin Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
  <script src="api-client.js?v=2.0"></script>
  <link rel="icon" type="image/png" href="favicon.png">
  <script>
    (function() {
      const saved = localStorage.getItem('artvot_theme');
      if (saved === 'light') {
        document.documentElement.classList.add('light-mode');
        document.body && document.body.classList.add('light-mode');
      } else if (saved === 'dark') {
        document.documentElement.classList.remove('light-mode');
        document.body && document.body.classList.remove('light-mode');
      } else {
        const prefersLight = window.matchMedia('(prefers-color-scheme: light)').matches;
        if (prefersLight) {
          document.documentElement.classList.add('light-mode');
          document.body && document.body.classList.add('light-mode');
        }
      }
    })();
  </script>
  <style>
        :root {
      --gold:          #D4AF37;
      --gold-light:    #F3E5AB;
      --pink:          #E53935;
      --green:         #16A34A;
      --bg:            #0A0A0C;
      --surface:       #121215;
      --text:          #F5F5F7;
      --text-secondary:rgba(255,255,255,0.5);
      --border:        rgba(212,175,55,0.08);
      --border-hover:  rgba(212, 175, 55, 0.18);
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:'DM Sans',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; display:flex; align-items:center; justify-content:center; overflow:hidden; }
    .admin-bg { position:fixed; inset:0; z-index:0; }
    .orb { position:absolute; border-radius:50%; filter:blur(100px); pointer-events:none; }
    .orb-1 { width:500px; height:500px; background:radial-gradient(circle,rgba(212,175,55,0.25),transparent 70%); top:-150px; left:-150px; animation:orbFloat 12s ease-in-out infinite; }
    .orb-2 { width:400px; height:400px; background:radial-gradient(circle,rgba(225,29,72,0.12),transparent 70%); bottom:-100px; right:-100px; animation:orbFloat 10s ease-in-out infinite reverse; }
        .grid-bg { position:fixed; inset:0; background-image:radial-gradient(circle,rgba(212,175,55,0.05) 1px,transparent 1px); background-size:30px 30px; pointer-events:none; }
    .login-container { position:relative; z-index:10; width:100%; max-width:440px; padding:24px; }
    .login-card { background:rgba(18,18,21,0.9); border:1px solid rgba(212,175,55,0.15); border-radius:24px; padding:48px 40px; box-shadow:0 40px 100px rgba(0,0,0,0.6), 0 0 25px rgba(212,175,55,0.05); backdrop-filter:blur(20px); animation:cardIn 0.5s ease; }
    @keyframes cardIn { from{opacity:0;transform:translateY(20px) scale(0.97)} to{opacity:1;transform:translateY(0) scale(1)} }
    .admin-badge { display:inline-flex; align-items:center; gap:6px; padding:6px 14px; background:rgba(212,175,55,0.1); border:1px solid rgba(212,175,55,0.25); border-radius:20px; font-size:0.75rem; font-weight:700; color:var(--gold); margin-bottom:20px; letter-spacing:0.08em; text-transform:uppercase; }
    .brand {
      font-family: 'Syne', sans-serif;
      font-size: 1.8rem;
      font-weight: 800;
      letter-spacing: -0.04em;
      margin-bottom: 4px;
      background: linear-gradient(135deg, var(--gold) 0%, var(--pink) 50%, var(--green) 100%);
      background-size: 200% 200%;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: gradientShift 3s ease infinite;
      display: inline-block;
    }
    .headline { font-family:'Syne',sans-serif; font-size:1.3rem; font-weight:700; margin-bottom:6px; }
    .sub { font-size:0.84rem; color:var(--text-secondary); margin-bottom:28px; }
    .input-wrap { position:relative; margin-bottom:14px; }
    .input-wrap .icon { position:absolute; left:13px; top:50%; transform:translateY(-50%); color:rgba(255,255,255,0.3); font-size:1rem; pointer-events:none; }
    .form-input { width:100%; padding:13px 14px 13px 40px; background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.09); border-radius:10px; color:#fff; font-family:'DM Sans',sans-serif; font-size:0.9rem; transition:all 0.2s; }
    .form-input::placeholder { color:rgba(255,255,255,0.3); }
      .form-input:focus { outline:none; border-color:var(--gold); background:rgba(212,175,55,0.05); box-shadow:0 0 0 3px rgba(212,175,55,0.15); }
    .btn-admin { width:100%; padding:14px; border-radius:10px; background:linear-gradient(135deg,var(--gold),#A37F1A); color:#000; font-family:'Syne',sans-serif; font-size:0.95rem; font-weight:700; border:none; cursor:pointer; transition:all 0.2s; box-shadow:0 6px 24px rgba(212,175,55,0.25); display:flex; align-items:center; justify-content:center; gap:8px; margin-top:8px; }
    .btn-admin:hover { transform:translateY(-1px); box-shadow:0 10px 32px rgba(212,175,55,0.45); }
    .btn-admin:disabled { opacity:0.6; cursor:not-allowed; transform:none; }
    .error-msg { background:rgba(225,29,72,0.08); border:1px solid rgba(225,29,72,0.25); border-radius:8px; padding:10px 14px; font-size:0.82rem; color:var(--pink); margin-bottom:14px; display:none; }
    .error-msg.show { display:block; }
    .back-link { display:block; text-align:center; margin-top:24px; font-size:0.82rem; color:var(--text-secondary); }
      .back-link a { color:var(--text-secondary); transition:color 0.2s; text-decoration:none; }
    .back-link a:hover { color:var(--gold); }
    @media(max-width:480px) { .login-card { padding:32px 22px; } }

    /* Light Mode Overrides for Admin Login Portal */
    body.light-mode .login-card {
      background: rgba(255, 255, 255, 0.95);
      border-color: rgba(139, 115, 85, 0.16);
      color: var(--text);
      box-shadow: var(--shadow-lg), var(--shadow-gold), 0 0 0 1px rgba(255, 255, 255, 0.6) inset;
    }
    body.light-mode .headline {
      color: var(--text);
    }
    body.light-mode .sub {
      color: var(--text-secondary);
    }
    body.light-mode .form-input {
      background: rgba(0, 0, 0, 0.03);
      border-color: var(--border);
      color: var(--text);
    }
    body.light-mode .form-input::placeholder {
      color: var(--text-muted);
    }
    body.light-mode .form-input:focus {
      background: rgba(212, 175, 55, 0.04);
      border-color: var(--gold);
      box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.15);
    }
    body.light-mode .input-wrap .icon {
      color: var(--text-secondary);
    }
    body.light-mode .back-link a {
      color: var(--text-secondary);
    }
    body.light-mode .back-link a:hover {
      color: var(--gold);
    }
    body.light-mode .error-msg {
      background: rgba(225, 29, 72, 0.06);
      border-color: rgba(225, 29, 72, 0.2);
      color: var(--pink);
    }
  </style>
</head>
<body>
<div class="admin-bg"><div class="orb orb-1"></div><div class="orb orb-2"></div></div>
<div class="grid-bg"></div>
<div class="login-container">
  <div class="login-card">
    <div class="admin-badge"><i class='bx bxs-shield-alt-2'></i> ADMIN ACCESS</div>
    <div class="brand" style="width: 100%; text-align:center; margin-bottom:16px;">ARTVOT</div>
    <h2 class="headline">Admin Panel</h2>
    <p class="sub">Restricted access — authorized administrators only</p>
    <div class="error-msg" id="login-error"></div>
    <div class="input-wrap">
      <i class='bx bx-envelope icon'></i>
      <input type="email" id="admin-email" class="form-input" placeholder="admin@artvot.com" autocomplete="email">
    </div>
    <div class="input-wrap">
      <i class='bx bx-lock-alt icon'></i>
      <input type="password" id="admin-password" class="form-input" placeholder="Admin password" autocomplete="current-password">
    </div>
    <button class="btn-admin" id="admin-login-btn">
      <i class='bx bx-log-in'></i> Access Admin Panel
    </button>
    <p class="back-link"><a href="login.html">← Back to user login</a></p>
  </div>
</div>
<script>
(function(){
  'use strict';
  // If already authenticated as admin, go to panel
  if (API.isAuthenticated()) {
    const user = API.getCurrentUser();
    if (user && user.roles && user.roles.includes('admin')) {
      window.location.href = 'admin-panel.html';
      return;
    }
  }
  const emailInput = document.getElementById('admin-email');
  const passInput = document.getElementById('admin-password');
  const loginBtn = document.getElementById('admin-login-btn');
  const errorEl = document.getElementById('login-error');

  function showError(msg) {
    errorEl.textContent = msg;
    errorEl.classList.add('show');
  }

  loginBtn.addEventListener('click', async () => {
    const email = emailInput.value.trim();
    const password = passInput.value;
    if (!email || !email.includes('@')) { showError('Please enter a valid email'); return; }
    if (!password) { showError('Please enter your password'); return; }

    loginBtn.disabled = true;
    loginBtn.innerHTML = '<i class="bx bx-loader-alt bx-spin"></i> Authenticating...';
    errorEl.classList.remove('show');

    try {
      const res = await API.auth.login(email, password);
      if (res.success && res.data && res.data.user) {
        const roles = res.data.user.roles || [];
        if (!roles.includes('admin')) {
          API.clearToken();
          API.clearCurrentUser();
          showError('Access denied. Admin privileges required.');
          loginBtn.disabled = false;
          loginBtn.innerHTML = '<i class="bx bx-log-in"></i> Access Admin Panel';
          return;
        }
        loginBtn.innerHTML = '<i class="bx bx-check"></i> Access Granted';
        loginBtn.style.background = 'linear-gradient(135deg,#3CE89D,#28A870)';
        setTimeout(() => { window.location.href = 'admin-panel.html'; }, 1000);
      } else {
        showError(res.message || 'Invalid credentials');
        loginBtn.disabled = false;
        loginBtn.innerHTML = '<i class="bx bx-log-in"></i> Access Admin Panel';
      }
    } catch(e) {
      showError('Network error. Please try again.');
      loginBtn.disabled = false;
      loginBtn.innerHTML = '<i class="bx bx-log-in"></i> Access Admin Panel';
    }
  });

  [emailInput, passInput].forEach(el => {
    el.addEventListener('keypress', e => { if(e.key==='Enter') loginBtn.click(); });
  });
})();
</script>
</body>
</html>
